<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubeworld</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 20px;
        height: 20px;
        pointer-events: none;
        z-index: 1000;
      }
      .crosshair::before,
      .crosshair::after {
        content: "";
        position: absolute;
        background: rgba(255, 255, 255, 0.8);
      }
      .crosshair::before {
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        transform: translateY(-50%);
      }
      .crosshair::after {
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        transform: translateX(-50%);
      }
      .hotbar {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        pointer-events: none;
        z-index: 1000;
      }
      .hotbar-slot {
        width: 50px;
        height: 50px;
        background: rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
        user-select: none;
        position: relative;
      }
      .hotbar-slot.selected {
        border-color: rgba(255, 255, 255, 0.9);
        background: rgba(255, 255, 255, 0.2);
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }
      .hotbar-slot-number {
        position: absolute;
        top: 2px;
        left: 2px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.7);
      }
      /* In-game HUD is hidden until the player is actually playing. */
      .crosshair,
      .hotbar {
        display: none;
      }
      body.playing .crosshair {
        display: block;
      }
      body.playing .hotbar {
        display: flex;
      }

      /* Menu (start + pause), styled to match the in-game panels. */
      .menu-overlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 2000;
      }
      .menu-overlay.visible {
        display: flex;
      }
      .menu-card {
        min-width: 280px;
        padding: 24px;
        background: rgba(0, 0, 0, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }
      .menu-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
        text-align: center;
        margin-bottom: 2px;
      }
      .menu-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .menu-row.inline {
        flex-direction: row;
        align-items: center;
        gap: 8px;
      }
      .menu-card input[type="text"] {
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        color: white;
        font: 14px monospace;
      }
      .menu-card input[type="text"]:focus {
        outline: none;
        border-color: rgba(255, 255, 255, 0.6);
      }
      .menu-card input[type="range"] {
        width: 100%;
        vertical-align: middle;
        accent-color: rgba(120, 200, 100, 0.9);
      }
      .menu-btn {
        padding: 9px 14px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        color: white;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.12s, border-color 0.12s;
      }
      .menu-btn:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.55);
      }
      .menu-btn.primary {
        background: rgba(80, 160, 60, 0.35);
        border-color: rgba(120, 200, 100, 0.6);
        font-weight: 700;
      }
      .menu-btn.primary:hover {
        background: rgba(80, 160, 60, 0.55);
      }
      .menu-seed-line {
        font: 12px monospace;
        color: rgba(255, 255, 255, 0.7);
        text-align: center;
      }
      .menu-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      .menu-status {
        min-height: 16px;
        font-size: 12px;
        color: rgba(150, 220, 140, 0.95);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="crosshair"></div>
    <div class="hotbar" id="hotbar"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
